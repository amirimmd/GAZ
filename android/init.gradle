// Gradle init: Aliyun mirrors for plugin repos and dependency repos (Iran / restricted networks).
def mirrors = [
    'https://maven.aliyun.com/repository/gradle-plugin',
    'https://mirrors.cloud.tencent.com/nexus/repository/gradle-plugins',
    'https://maven.aliyun.com/repository/google',
    'https://maven.aliyun.com/repository/central',
    'https://maven.aliyun.com/repository/public',
]
def flutterStorage = System.getenv('FLUTTER_STORAGE_BASE_URL') ?: 'https://storage.flutter-io.cn'
def flutterMaven = "${flutterStorage}/download.flutter.io"

gradle.beforeSettings { settings ->
    settings.pluginManagement.repositories.with {
        clear()
        mirrors.each { m -> maven { url m } }
        maven { url flutterMaven }
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

gradle.beforeProject { project ->
    project.buildscript.repositories.with {
        clear()
        mirrors.each { m -> maven { url m } }
        maven { url flutterMaven }
        google()
        mavenCentral()
    }
    try {
        project.repositories.with {
            clear()
            mirrors.each { m -> maven { url m } }
            maven { url flutterMaven }
            google()
            mavenCentral()
        }
    } catch (Throwable ignored) {
        // Included builds / settings-managed repos may reject project repos.
    }
}
