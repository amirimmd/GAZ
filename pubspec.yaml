name: gaz_hrms
description: Enterprise Human Resource Management System — Gas Company Qaemshahr Branch
publish_to: "none"
version: 2.1.0+9

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  drift: ^2.26.0
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.32
  path: ^1.9.1
  path_provider: ^2.1.5

  crypto: ^3.0.6
  pointycastle: ^3.9.1

  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  data_table_2: ^2.5.18

  intl: any
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.1
  characters: ^1.3.0
  logger: ^2.5.0
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  shamsi_date: ^1.0.4
  window_manager: ^0.4.3

  file_picker: ^8.3.2
  open_filex: ^4.7.0
  share_plus: ^10.1.4
  mime: ^2.0.0
  archive: ^3.6.1

  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/fonts/
